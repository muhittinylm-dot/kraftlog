<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- CSP im META-Tag: GitHub Pages bietet keine eigenen HTTP-Header.
       Das blockiert Fremdskripte, aber nicht Clickjacking: frame-ancestors braucht einen HTTP-Header. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bfa488">
  <meta name="color-scheme" content="light only">
  <meta name="description" content="KRAFTLOG: Kraft- und Cardio-Training, Trainingspläne, Fortschrittsstatistiken und Pausentimer.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./app.css?v=70">
  <title>KRAFTLOG – Mein Training</title>
</head>
<body>
  <div id="app">
    <div class="splash"><div class="brand-icon">K<span>↗</span></div><strong>KRAFTLOG</strong><span>Dein Training. Deine Daten.</span></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./cloud-config.js?v=70" defer></script>
  <script src="./cloud.js?v=70" defer></script>
  <script src="./app.js?v=70" defer></script>
</body>
</html>
